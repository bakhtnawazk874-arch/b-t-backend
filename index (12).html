<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-T AI — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#090A11;
    --bg-panel:#0D0F19;
    --glass:rgba(255,255,255,0.045);
    --glass-hover:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.09);
    --ink:#F1F0F7;
    --ink-soft:#8B899C;
    --violet:#8B5CF6;
    --cyan:#22D3EE;
    --accent-grad:linear-gradient(135deg,var(--violet),var(--cyan));
    --line:rgba(255,255,255,0.09);
    --danger:#FF6B6B;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg-deep);
    color:var(--ink);
    display:flex;
    height:100vh;
    overflow:hidden;
    position:relative;
  }
  ::selection{background:rgba(139,92,246,0.35);}

  /* Ambient glow orbs — signature element */
  .glow-orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.32;}
  .glow-orb.o1{width:520px;height:520px;background:var(--violet);top:-160px;left:-120px;animation:drift1 22s ease-in-out infinite;}
  .glow-orb.o2{width:460px;height:460px;background:var(--cyan);bottom:-140px;right:-100px;animation:drift2 26s ease-in-out infinite;}
  .glow-orb.o3{width:340px;height:340px;background:var(--violet);top:40%;left:45%;opacity:.16;animation:drift3 30s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.15);}}
  @media (prefers-reduced-motion: reduce){.glow-orb{animation:none;}}

  .sidebar{
    width:270px;
    min-width:270px;
    background:var(--glass);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border-right:1px solid var(--glass-border);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    position:relative;
    z-index:2;
  }
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:22px;padding:0 4px;}
  .brand .mark{
    font-family:'Sora',sans-serif;font-size:21px;font-weight:700;
    background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;}
  .new-chat{
    display:flex;align-items:center;gap:8px;
    background:var(--glass);border:1px solid var(--glass-border);
    color:var(--ink);padding:10px 14px;border-radius:var(--radius);
    font-size:14px;font-weight:500;cursor:pointer;transition:all .2s ease;font-family:inherit;
  }
  .new-chat:hover{background:var(--glass-hover);border-color:rgba(139,92,246,0.4);box-shadow:0 0 20px rgba(139,92,246,0.18);transform:translateY(-1px);}
  .new-chat:active{transform:translateY(0);}
  .new-chat svg{width:16px;height:16px;flex-shrink:0;}

  .thread-list{
    margin-top:20px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
    position:relative;padding-left:10px;border-left:1px solid var(--line);
  }
  .thread-item{
    position:relative;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .18s ease, transform .18s ease, color .18s ease;
  }
  .thread-item::before{content:'';position:absolute;left:-11px;top:50%;width:8px;height:1px;background:var(--line);}
  .thread-item:hover{background:var(--glass-hover);transform:translateX(2px);color:var(--ink);}
  .thread-item.active{background:rgba(139,92,246,0.14);color:#fff;font-weight:500;box-shadow:inset 0 0 0 1px rgba(139,92,246,0.3);}

  .upgrade-row{
    margin-top:16px;display:flex;align-items:center;gap:10px;
    padding:11px 12px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:12px;cursor:pointer;transition:all .2s ease;
  }
  .upgrade-row:hover{background:var(--glass-hover);border-color:rgba(139,92,246,0.4);box-shadow:0 0 20px rgba(139,92,246,0.16);transform:translateY(-1px);}
  .upgrade-row:active{transform:translateY(0);}
  .upgrade-icon{
    width:26px;height:26px;border-radius:8px;flex-shrink:0;
    background:var(--accent-grad);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 12px rgba(139,92,246,0.4);
  }
  .upgrade-icon svg{width:14px;height:14px;color:#0A0B12;}
  .upgrade-text{flex:1;min-width:0;}
  .upgrade-text .title{font-size:13px;font-weight:600;color:var(--ink);}
  .upgrade-text .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .upgrade-row .chevron{width:14px;height:14px;color:var(--ink-soft);flex-shrink:0;}
  .usage-caption{
    margin-top:8px;padding:0 4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .usage-caption .bar{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;margin:0 8px;}
  .usage-caption .bar-fill{height:100%;background:var(--accent-grad);border-radius:99px;transition:width .3s ease;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1;}
  .topbar{padding:14px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(9,10,17,0.4);backdrop-filter:blur(16px);}
  .topbar-title{font-family:'Sora',sans-serif;font-size:14.5px;font-weight:600;color:var(--ink);}
  .topbar-title span{color:var(--ink-soft);font-weight:400;font-family:'Inter',sans-serif;}
  .model-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border:1px solid var(--glass-border);background:var(--glass);border-radius:99px;color:var(--ink-soft);}

  .messages{flex:1;overflow-y:auto;padding:32px 0 12px;}
  .msg-wrap{
    max-width:680px;margin:0 auto 22px;padding:0 24px;display:flex;gap:14px;
    animation:msgIn .35s ease both;
  }
  @keyframes msgIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .avatar{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-size:12px;font-weight:600;margin-top:2px;transition:transform .18s ease;
  }
  .msg-wrap:hover .avatar{transform:scale(1.06);}
  .avatar.user{background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);}
  .avatar.ai{background:var(--accent-grad);color:#0A0B12;box-shadow:0 0 16px rgba(139,92,246,0.4);}
  .bubble{flex:1;padding-top:4px;}
  .bubble .role{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace;}
  .bubble .text{font-size:15px;line-height:1.65;color:var(--ink);white-space:pre-wrap;}
  .bubble .gen-image{max-width:100%;border-radius:14px;margin-top:8px;display:block;border:1px solid var(--glass-border);box-shadow:0 0 30px rgba(139,92,246,0.15);}

  .empty-state{max-width:520px;margin:10vh auto 0;text-align:center;padding:0 24px;animation:msgIn .4s ease both;}
  .empty-state .mark{font-family:'Sora',sans-serif;font-size:34px;font-weight:700;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;}
  .empty-state p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

  .composer{padding:16px 24px 22px;}
  .composer-inner{
    max-width:680px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;
    background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:16px;padding:10px 10px 10px 16px;
    transition:all .25s ease;
  }
  .composer-inner:focus-within{
    border-color:rgba(139,92,246,0.5);
    box-shadow:0 0 0 1px rgba(139,92,246,0.15), 0 0 32px rgba(139,92,246,0.22), 0 0 60px rgba(34,211,238,0.08);
  }
  textarea{flex:1;border:none;outline:none;resize:none;font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.5;max-height:160px;color:var(--ink);background:transparent;}
  textarea::placeholder{color:var(--ink-soft);}
  .send-btn{
    width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:all .2s ease;
  }
  .send-btn:hover:not(:disabled){background:var(--accent-grad);color:#0A0B12;box-shadow:0 0 18px rgba(139,92,246,0.5);transform:scale(1.06);}
  .send-btn:disabled{background:var(--glass);color:var(--ink-soft);cursor:not-allowed;opacity:.5;}
  .send-btn svg{width:16px;height:16px;}
  .image-btn{
    width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;
    transition:all .2s ease;
  }
  .image-btn:hover{background:var(--accent-grad);box-shadow:0 0 18px rgba(34,211,238,0.4);transform:scale(1.06);}
  .composer-note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;font-family:'JetBrains Mono',monospace;}

  .typing{display:flex;gap:4px;padding:6px 0;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 6px rgba(139,92,246,0.7);animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;background:var(--cyan);box-shadow:0 0 6px rgba(34,211,238,0.7);}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.typing span{animation:none;}.glow-orb{animation:none;}}
  @media (max-width:720px){
    .sidebar{position:absolute;z-index:10;height:100%;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
  }
</style>
</head>
<body>

  <div class="glow-orb o1"></div>
  <div class="glow-orb o2"></div>
  <div class="glow-orb o3"></div>

  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark">B-T AI</span>
      <span class="sub" id="userGreeting">chat</span>
    </div>
    <button class="new-chat" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="thread-list" id="threadList"></div>
    <div class="upgrade-row" id="upgradeBtn">
      <div class="upgrade-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg>
      </div>
      <div class="upgrade-text">
        <div class="title">Upgrade</div>
        <div class="sub">More usage, higher limits</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div class="usage-caption">
      <span id="planCaption">0 / 100</span>
      <span class="bar"><span class="bar-fill" id="planMeterFill" style="width:0%"></span></span>
      <span>today</span>
    </div>
    <div style="margin-top:10px;text-align:center;">
      <a href="#" id="logoutLink" style="font-size:11.5px;color:#8A887E;text-decoration:none;transition:color .18s ease;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8A887E'">Log out</a>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="threadTitle">New chat</div>
      <div class="model-pill">B-T AI</div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="mark">B-T AI</div>
        <p>Type a question below to start chatting.</p>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Type your message... (or 'image banao a sunset' for an image)"></textarea>
        <button class="image-btn" id="imageGenBtn" title="Generate image" aria-label="Generate image">🖼️</button>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="composer-note">B-T AI — your data stays in your own database</div>
    </div>
  </div>

<script>
  let currentUserId = localStorage.getItem('bt_user_id');
  let currentUserName = localStorage.getItem('bt_user_name');
  if (!currentUserId) {
    currentUserId = 'demo-user';
    currentUserName = 'Demo';
  }
  document.getElementById('userGreeting').textContent = currentUserName ? `Welcome, ${currentUserName}` : 'chat';
  document.getElementById('logoutLink').onclick = (e) => {
    e.preventDefault();
    localStorage.removeItem('bt_user_id');
    localStorage.removeItem('bt_user_name');
    window.location.href = 'auth.html';
  };

  const DAILY_LIMIT = 100;
  const state = {
    threads: JSON.parse(localStorage.getItem('bt_threads') || '[]'),
    activeId: null,
    usedToday: parseInt(localStorage.getItem('bt_used_' + todayKey()) || '0', 10),
  };

  function todayKey(){ return new Date().toISOString().slice(0,10); }
  function save(){ localStorage.setItem('bt_threads', JSON.stringify(state.threads)); }
  function saveUsage(){ localStorage.setItem('bt_used_' + todayKey(), String(state.usedToday)); }

  const threadListEl = document.getElementById('threadList');
  const messagesEl = document.getElementById('messages');
  const emptyStateEl = document.getElementById('emptyState');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const imageGenBtn = document.getElementById('imageGenBtn');
  const threadTitleEl = document.getElementById('threadTitle');
  const planMeterFill = document.getElementById('planMeterFill');
  const planCaption = document.getElementById('planCaption');

  function renderThreadList(){
    threadListEl.innerHTML = '';
    state.threads.slice().reverse().forEach(t => {
      const item = document.createElement('div');
      item.className = 'thread-item' + (t.id === state.activeId ? ' active' : '');
      item.textContent = t.title;
      item.onclick = () => { state.activeId = t.id; renderAll(); };
      threadListEl.appendChild(item);
    });
  }

  function renderMessages(){
    const thread = state.threads.find(t => t.id === state.activeId);
    messagesEl.innerHTML = '';
    if(!thread || thread.messages.length === 0){
      messagesEl.appendChild(emptyStateEl);
      threadTitleEl.textContent = 'New chat';
      return;
    }
    threadTitleEl.textContent = thread.title;
    thread.messages.forEach(m => {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap';
      wrap.innerHTML = `
        <div class="avatar ${m.role === 'user' ? 'user' : 'ai'}">${m.role === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble">
          <div class="role">${m.role === 'user' ? 'You' : 'B-T AI'}</div>
          <div class="text"></div>
        </div>`;
      const textEl = wrap.querySelector('.text');
      if(m.type === 'image'){
        if(m.imageUrl){
          textEl.textContent = m.content || '';
          const img = document.createElement('img');
          img.className = 'gen-image';
          img.src = m.imageUrl;
          img.alt = m.content || 'Generated image';
          wrap.querySelector('.bubble').appendChild(img);
        } else {
          textEl.textContent = m.content;
        }
      } else {
        textEl.textContent = m.content;
      }
      messagesEl.appendChild(wrap);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderPlan(){
    const pct = Math.min(100, (state.usedToday / DAILY_LIMIT) * 100);
    planMeterFill.style.width = pct + '%';
    planCaption.textContent = `${state.usedToday} / ${DAILY_LIMIT}`;
  }

  function renderAll(){ renderThreadList(); renderMessages(); renderPlan(); }

  document.getElementById('newChatBtn').onclick = () => {
    const thread = { id: crypto.randomUUID(), title: 'New chat', messages: [] };
    state.threads.push(thread);
    state.activeId = thread.id;
    save();
    renderAll();
    inputEl.focus();
  };

  document.getElementById('upgradeBtn').onclick = () => {
    alert('Connect your payment flow here (EasyPaisa / JazzCash / card) — the transaction will be recorded in the payments table (schema.sql).');
  };

  inputEl.addEventListener('input', () => {
    sendBtn.disabled = inputEl.value.trim().length === 0;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ---------------------------------------------------------
  // Image generation — (1) dedicated button, (2) auto-detect
  // from normal chat text (e.g. "image banao a sunset")
  // ---------------------------------------------------------
  const IMAGE_TRIGGERS = ['image banao', 'photo banao', 'picture banao', 'tasveer banao', 'generate image', 'draw'];

  function isImageRequest(text){
    const lower = text.toLowerCase();
    return IMAGE_TRIGGERS.some(t => lower.includes(t));
  }

  // Clicking the image button no longer opens a popup — it just primes
  // the normal chat box, exactly like ChatGPT/Gemini's image mode.
  // The user types their prompt in the same box and hits Send/Enter,
  // and the image appears inline in the conversation below.
  imageGenBtn.addEventListener('click', () => {
    inputEl.value = 'image banao: ';
    inputEl.focus();
    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    sendBtn.disabled = inputEl.value.trim().length === 0;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  function cleanImagePrompt(text){
    let cleaned = text;
    IMAGE_TRIGGERS.forEach(t => {
      const idx = cleaned.toLowerCase().indexOf(t);
      if(idx !== -1){
        cleaned = cleaned.slice(0, idx) + cleaned.slice(idx + t.length);
      }
    });
    return cleaned.replace(/^[:,\s]+/, '').trim() || text;
  }

  async function handleImageRequest(promptText){
    if(state.usedToday >= DAILY_LIMIT){
      alert("You've reached today's free limit (100 messages). Upgrade to Pro for unlimited access.");
      return;
    }

    const cleanedPrompt = cleanImagePrompt(promptText);

    let thread = state.threads.find(t => t.id === state.activeId);
    if(!thread){
      thread = { id: crypto.randomUUID(), title: promptText.slice(0, 40), messages: [] };
      state.threads.push(thread);
      state.activeId = thread.id;
    }
    if(thread.messages.length === 0){ thread.title = promptText.slice(0, 40); }

    thread.messages.push({ role: 'user', content: promptText });
    save();
    renderAll();

    const typingWrap = document.createElement('div');
    typingWrap.className = 'msg-wrap';
    typingWrap.innerHTML = `<div class="avatar ai">AI</div><div class="bubble"><div class="role">B-T AI</div><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(typingWrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    let imageUrl = null;
    try{
      const res = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: cleanedPrompt })
      });
      const data = await res.json();
      imageUrl = data.imageUrl || null;
    }catch(err){
      console.error('Image generation failed:', err);
    }

    typingWrap.remove();
    thread.messages.push({
      role: 'assistant',
      type: 'image',
      content: imageUrl ? cleanedPrompt : 'Image nahi ban saki. Dobara koshish karein.',
      imageUrl
    });
    state.usedToday++;
    save(); saveUsage();
    renderAll();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    // If the message looks like an image request, generate an image instead
    if(isImageRequest(text)){
      await handleImageRequest(text);
      return;
    }

    if(state.usedToday >= DAILY_LIMIT){
      alert("You've reached today's free limit (100 messages). Upgrade to Pro for unlimited access.");
      return;
    }

    let thread = state.threads.find(t => t.id === state.activeId);
    if(!thread){
      thread = { id: crypto.randomUUID(), title: text.slice(0, 40), messages: [] };
      state.threads.push(thread);
      state.activeId = thread.id;
    }
    if(thread.messages.length === 0){ thread.title = text.slice(0, 40); }

    thread.messages.push({ role: 'user', content: text });
    save();
    renderAll();

    const typingWrap = document.createElement('div');
    typingWrap.className = 'msg-wrap';
    typingWrap.innerHTML = `<div class="avatar ai">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(typingWrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const reply = await getAIResponse(text);

    typingWrap.remove();
    thread.messages.push({ role: 'assistant', content: reply });
    state.usedToday++;
    save(); saveUsage();
    renderAll();
  }

  // ---------------------------------------------------------
  // Replace this function to call YOUR backend (see server.js),

  async function getAIResponse(userText){
    try{
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: state.activeId, message: userText, userId: currentUserId })
      });
      if(!res.ok) throw new Error('backend not available');
      const data = await res.json();
      return data.reply;
    }catch(err){
      return "Sorry, I couldn't reach the server. Please check your connection and try again.";
    }
  }
